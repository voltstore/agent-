<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neon-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#ff2d78" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.06" stroke="#4488ff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Outer ring glow -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2" filter="url(#glow-blue)"/>
  <circle cx="256" cy="220" r="155" fill="none" stroke="#7b2fff" stroke-width="0.5" opacity="0.15"/>

  <!-- Center glow blob -->
  <ellipse cx="256" cy="220" rx="100" ry="80" fill="#7b2fff" opacity="0.08" filter="url(#glow-strong)"/>
  <ellipse cx="256" cy="220" rx="60" ry="50" fill="#00d4ff" opacity="0.06" filter="url(#glow-strong)"/>

  <!-- Robot head -->
  <rect x="176" y="140" width="160" height="130" rx="20" fill="none" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow-blue)" opacity="0.9"/>
  <rect x="178" y="142" width="156" height="126" rx="18" fill="#050a18" opacity="0.95"/>

  <!-- Robot antenna -->
  <line x1="256" y1="140" x2="256" y2="110" stroke="#00d4ff" stroke-width="2" filter="url(#glow-blue)" opacity="0.8"/>
  <circle cx="256" cy="104" r="8" fill="#00d4ff" filter="url(#glow-strong)" opacity="0.9"/>
  <circle cx="256" cy="104" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Robot eyes -->
  <!-- Left eye -->
  <rect x="200" y="168" width="44" height="32" rx="8" fill="#0a1628" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow-blue)" opacity="0.8"/>
  <rect x="208" y="174" width="28" height="20" rx="5" fill="#00d4ff" opacity="0.15"/>
  <ellipse cx="222" cy="184" rx="10" ry="10" fill="#00d4ff" opacity="0.9" filter="url(#glow-blue)"/>
  <ellipse cx="222" cy="184" rx="5" ry="5" fill="#ffffff"/>
  <ellipse cx="224" cy="182" rx="2" ry="2" fill="#0a1628"/>

  <!-- Right eye -->
  <rect x="268" y="168" width="44" height="32" rx="8" fill="#0a1628" stroke="#ff2d78" stroke-width="1.5" filter="url(#glow-pink)" opacity="0.8"/>
  <rect x="276" y="174" width="28" height="20" rx="5" fill="#ff2d78" opacity="0.15"/>
  <ellipse cx="290" cy="184" rx="10" ry="10" fill="#ff2d78" opacity="0.9" filter="url(#glow-pink)"/>
  <ellipse cx="290" cy="184" rx="5" ry="5" fill="#ffffff"/>
  <ellipse cx="292" cy="182" rx="2" ry="2" fill="#0a1628"/>

  <!-- Robot mouth -->
  <rect x="210" y="218" width="92" height="18" rx="9" fill="#0a1628" stroke="#7b2fff" stroke-width="1.5" filter="url(#glow-blue)" opacity="0.8"/>
  <rect x="218" y="223" width="12" height="8" rx="2" fill="#7b2fff" opacity="0.8"/>
  <rect x="234" y="223" width="12" height="8" rx="2" fill="#00d4ff" opacity="0.8"/>
  <rect x="250" y="223" width="12" height="8" rx="2" fill="#7b2fff" opacity="0.8"/>
  <rect x="266" y="223" width="12" height="8" rx="2" fill="#00d4ff" opacity="0.8"/>
  <rect x="282" y="223" width="12" height="8" rx="2" fill="#7b2fff" opacity="0.8"/>

  <!-- Neck -->
  <rect x="236" y="270" width="40" height="16" rx="4" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Neon line separator -->
  <line x1="60" y1="310" x2="452" y2="310" stroke="url(#line-grad)" stroke-width="1.5" opacity="0.8"/>

  <!-- SORA text - main neon -->
  <text x="256" y="375" 
    font-family="Arial Black, Impact, sans-serif" 
    font-size="88" 
    font-weight="900"
    text-anchor="middle" 
    fill="url(#neon-text)"
    filter="url(#glow-strong)"
    letter-spacing="8"
    opacity="0.95">SORA</text>

  <!-- SORA text - inner bright -->
  <text x="256" y="375" 
    font-family="Arial Black, Impact, sans-serif" 
    font-size="88" 
    font-weight="900"
    text-anchor="middle" 
    fill="none"
    stroke="#ffffff"
    stroke-width="0.8"
    letter-spacing="8"
    opacity="0.4">SORA</text>

  <!-- Bottom line -->
  <line x1="60" y1="395" x2="452" y2="395" stroke="url(#line-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Subtitle dots -->
  <circle cx="196" cy="415" r="3" fill="#00d4ff" opacity="0.7" filter="url(#glow-blue)"/>
  <circle cx="256" cy="415" r="3" fill="#7b2fff" opacity="0.7" filter="url(#glow-blue)"/>
  <circle cx="316" cy="415" r="3" fill="#ff2d78" opacity="0.7" filter="url(#glow-pink)"/>

  <!-- Corner accents -->
  <path d="M 30 30 L 70 30 L 70 35 L 35 35 L 35 70 L 30 70 Z" fill="#00d4ff" opacity="0.4"/>
  <path d="M 482 30 L 442 30 L 442 35 L 477 35 L 477 70 L 482 70 Z" fill="#00d4ff" opacity="0.4"/>
  <path d="M 30 482 L 70 482 L 70 477 L 35 477 L 35 442 L 30 442 Z" fill="#ff2d78" opacity="0.4"/>
  <path d="M 482 482 L 442 482 L 442 477 L 477 477 L 477 442 L 482 442 Z" fill="#ff2d78" opacity="0.4"/>
</svg>
